server {
    listen 80;
    server_name _;

    location / {
        proxy_pass http://web-app:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /healthz {
        return 200 '{"status":"ok"}';
        add_header Content-Type application/json;
    }
}
